<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Box</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:Arial,"Noto Sans Arabic",sans-serif;
    background:linear-gradient(145deg,#0b1220,#17243b);
    display:flex; justify-content:center; align-items:center; padding:20px;
  }
  .app{
    width:min(620px,100%); background:#fff; border-radius:24px; padding:24px;
    box-shadow:0 20px 60px #0008;
  }
  h1{text-align:center;margin:0 0 8px;color:#17243b;font-size:27px}
  .sub{text-align:center;color:#667085;margin:0 0 20px}
  textarea{
    width:100%; min-height:170px; resize:vertical; border:2px solid #d7dce5;
    border-radius:16px; padding:18px; font-size:20px; direction:ltr;
    outline:none; line-height:1.6; background:#f8fafc;
  }
  textarea:focus{border-color:#315efb; box-shadow:0 0 0 4px #315efb18}
  .counter{text-align:left;color:#667085;font-size:13px;margin:7px 4px 16px}
  .buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  button{
    border:0;border-radius:14px;padding:15px 8px;font-size:17px;font-weight:700;
    cursor:pointer;color:white;transition:.15s;min-height:54px;
  }
  button:active{transform:scale(.97)}
  .copy{background:#2563eb}.paste{background:#16a34a}.remove{background:#dc2626}
  .status{text-align:center;min-height:24px;margin-top:14px;color:#475467;font-size:14px}
  @media(max-width:430px){.buttons{grid-template-columns:1fr}.app{padding:18px}}
</style>
</head>
<body>
<div class="app">
  <h1>کوڈ مینیجر</h1>
  <p class="sub">تقریباً 50 ہندسوں کا کوڈ یہاں لکھیں یا پیسٹ کریں</p>
  <textarea id="code" maxlength="200" inputmode="numeric" placeholder="یہاں کوڈ درج کریں..."></textarea>
  <div class="counter"><span id="count">0</span> حروف</div>
  <div class="buttons">
    <button class="copy" onclick="copyCode()">کاپی</button>
    <button class="paste" onclick="pasteCode()">پیسٹ</button>
    <button class="remove" onclick="removeSpaces()">ریموو اسپیس</button>
  </div>
  <div id="status" class="status"></div>
</div>
<script>
const box=document.getElementById('code'), count=document.getElementById('count'), status=document.getElementById('status');
function update(){count.textContent=box.value.length}
box.addEventListener('input',update);
async function copyCode(){
  if(!box.value){show('کاپی کرنے کے لیے پہلے کوڈ لکھیں');return}
  try{await navigator.clipboard.writeText(box.value);show('کوڈ کاپی ہوگیا ✓')}
  catch(e){box.select();document.execCommand('copy');show('کوڈ کاپی ہوگیا ✓')}
}
async function pasteCode(){
  try{box.value=await navigator.clipboard.readText();update();show('کوڈ پیسٹ ہوگیا ✓')}
  catch(e){show('پیسٹ کی اجازت نہ ملنے پر باکس کو دبا کر Paste منتخب کریں')}
}
function removeSpaces(){
  box.value=box.value.replace(/\s+/g,'');
  update(); show('تمام اسپیس ختم کردی گئی ہیں ✓');
}
function show(t){status.textContent=t;setTimeout(()=>status.textContent='',2500)}
update();
</script>
</body>
</html>
